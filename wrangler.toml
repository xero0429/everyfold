# Everyfold server — Cloudflare Worker + D1. Lives at the repo root so the "Deploy to Cloudflare" button
# (which needs the whole pnpm workspace: apps/server imports packages/core) can deploy it.
# Everyfold 서버 — Cloudflare Worker + D1.
# "Deploy to Cloudflare" 버튼은 아래 D1 바인딩을 보고 데이터베이스를 새로 만든다(database_id 는 배포 때 채워짐).
name = "everyfold"
main = "apps/server/src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "everyfold"
migrations_dir = "apps/server/migrations"

# 하루 1개 자동 스냅샷(UTC 18:00 = KST 03:00)
[triggers]
crons = ["0 18 * * *"]

# 비밀값은 여기 두지 않는다:
#   wrangler secret put ADMIN_TOKEN        (기기 등록용 관리자 토큰, 필수)
#   wrangler secret put ANTHROPIC_API_KEY  (선택 — 없으면 규칙 분류만)
