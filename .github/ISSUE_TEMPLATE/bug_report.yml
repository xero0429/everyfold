name: Bug report
description: Something is broken (sync, import, categorizing, the extension…)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: browsers
    attributes:
      label: Browsers and versions
      placeholder: Chrome 140 on macOS, Firefox 145 on Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Everyfold version (extension and server commit)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Extension service worker console and/or `wrangler tail` output. Remove tokens and private URLs.
      render: text
